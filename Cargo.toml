[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
kinogaki-deflate = { path = "crates/deflate" }
kinogaki-image = { path = "crates/image" }
kinogaki-png = { path = "crates/png" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
overflow-checks = true

# Codec tests round-trip megabytes; keep test builds fast.
[profile.test]
opt-level = 2
